 const dialog=document.createElement('dialog');dialog.className='patrol-modal';dialog.setAttribute('aria-label',title);
 const header=document.createElement('header');header.className='patrol-modal-header';const heading=document.createElement('strong');heading.textContent=title;const close=document.createElement('button');close.type='button';close.className='patrol-modal-close';close.textContent='×';close.setAttribute('aria-label','关闭');header.append(heading,close);dialog.append(header);

window.mountPatrolSupport=function({host,container,call,ready=()=>true}){
 const make=(tag,text,parent)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(parent)parent.append(e);return e};
 const button=make('button',host?'教师反馈':'问题反馈 / 联系统计端',container);button.type='button';
 const modal=window.patrolModal(host?'教师问题与回复':'联系统计端');const panel=make('section',null,modal.body);panel.className='patrol-support';
 make('strong',host?'教师问题与回复':'联系统计端',panel);
 make('p',host?'选择教师查看问题并回复。':'遇到页面、课程或提交问题，可在这里说明。完全断网时请联网后重试。',panel);
 const select=host?make('select',null,panel):null;
 if(select)select.setAttribute('aria-label','选择反馈教师');
 if(host){const actions=make('div',null,panel);actions.className='support-actions';for(const [kind,label] of Object.entries({diagnose:'检查页面状态',repair:'修复白屏',refresh:'同步课程',filters:'恢复线路显示',reconnect:'恢复联机'})){const btn=make('button',label,actions);btn.type='button';btn.onclick=async()=>{if(!selected){status.textContent='请先选择教师';return}btn.disabled=true;try{rows=(await call({action:'command',uid:selected,kind,messageId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)})).messages;render();status.textContent='已发送处理请求，等待教师端回执'}catch(e){status.textContent=e.message}finally{btn.disabled=false}}}}
 const list=make('div',null,panel);list.className='support-messages';
 const input=make('textarea',null,panel);input.rows=3;input.maxLength=2000;input.placeholder=host?'输入给这位教师的回复…':'请说明遇到的问题，例如哪条线路、哪个班、页面提示什么…';input.setAttribute('aria-label',host?'回复内容':'问题描述');
 const send=make('button',host?'发送回复':'发送问题',panel);send.type='button';
 const status=make('p','',panel);status.setAttribute('role','status');
 let executed=new Set(),processing=false;
 let rows=[],selected='',busy=false,signature='',pending=null;

 input.oninput=()=>{pending=null;try{localStorage.setItem(draftKey,input.value)}catch{}};
 function render(){
  const unread=rows.filter(r=>!r.seen&&r.sender===(host?'teacher':'host')).length;
  button.textContent=(host?'教师反馈':'问题反馈 / 联系统计端')+(unread?'（'+unread+'条未读）':'');
  if(host){const people=new Map(rows.map(r=>[r.uid,r]));const old=select.value||selected;select.replaceChildren();for(const [uid,r] of people){const o=make('option',r.name+' · '+r.employee,select);o.value=uid}select.value=people.has(old)?old:(people.keys().next().value||'');selected=select.value;}
  const visible=rows.filter(r=>!host||r.uid===selected),sig=JSON.stringify(visible);
  if(sig!==signature){signature=sig;list.replaceChildren();if(!visible.length)make('p','暂无消息',list);for(const r of visible){const box=make('div',null,list);box.className='support-message';make('strong',(r.sender==='host'?'统计端':r.name)+' · '+new Date(r.time*1000).toLocaleString('zh-CN'),box);make('p',r.text,box);if(r.command)make('p','处理结果：'+r.result,box)}list.scrollTop=list.scrollHeight}
 }
 async function refresh(){if(busy||!ready()||document.hidden)return;busy=true;try{rows=(await call({action:'list'})).messages||[];render();if(!host)processCommands().catch(()=>{});if(modal.dialog.open){const ids=rows.filter(r=>(!host||r.uid===selected)&&!r.seen&&r.sender===(host?'teacher':'host')).map(r=>r.id);if(ids.length){rows=(await call({action:'seen',uid:selected,ids})).messages||[];render()}}}catch(e){if(modal.dialog.open)status.textContent='暂未取得新消息：'+e.message}finally{busy=false}}
 button.onclick=()=>{modal.open();if(modal.dialog.open){if(!ready())status.textContent='请先联机，连接成功后可发送问题。';refresh()}};
 if(select)select.onchange=()=>{selected=select.value;signature='';render();refresh()};
 send.onclick=async()=>{if(!ready()){status.textContent='尚未联机，输入内容已保留，请恢复联机后发送。';return}const text=input.value.trim();if(!text){status.textContent='请先填写内容。';return}if(host&&!selected){status.textContent='请先选择教师。';return}send.disabled=true;input.disabled=true;const uid=selected;if(!pending||pending.text!==text||pending.uid!==uid)pending={text,uid,messageId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)};try{rows=(await call({action:'send',...pending})).messages||[];input.value='';pending=null;try{localStorage.removeItem(draftKey)}catch{}status.textContent='已发送';render()}catch(e){status.textContent='发送未确认，内容已保留，可重试：'+e.message}finally{send.disabled=false;input.disabled=false}};
 async function processCommands(){if(processing)return;processing=true;try{for(const row of rows.filter(r=>r.command&&!r.finished&&!executed.has(r.id))){if(Date.now()/1000-row.time>300){await call({action:'result',messageId:row.id,result:'请求已过期，请统计端重新发起'});continue}let result;try{result=await window.patrolQuickRepair(row.command)}catch(e){result='未完成：'+e.message}await call({action:'result',messageId:row.id,result});executed.add(row.id)}}finally{processing=false}}
